<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./app.css">
<script type="module" src="./app.js"></script>
</head>
<body>
<div class="app">
  <div id="tabbar" class="tabbar" role="tablist" aria-label="Open files" hidden></div>

  <div id="toolbar" class="toolbar" hidden>
    <span id="filename" class="filename"></span>
    <div id="mode-switch" class="mode-switch" hidden></div>
  </div>

  <div id="app-banner" class="banner banner-error" role="alert" hidden>
    <span id="app-banner-text" class="banner-text"></span>
    <button id="app-banner-close" type="button" class="banner-close" aria-label="Dismiss" title="Dismiss">×</button>
  </div>

  <main id="content" class="content">
    <div class="column">
      <section id="start" class="empty start">
        <h1 class="wordmark">Folio</h1>
        <div class="start-actions">
          <button id="start-open-file" type="button" class="btn btn-primary" title="Open a file (Ctrl+O)">Open file</button>
          <button id="start-open-folder" type="button" class="btn" title="Open a folder (Ctrl+Shift+O)" disabled>Open folder</button>
          <button id="start-new-file" type="button" class="btn" title="New file (Ctrl+N)" disabled>New file</button>
        </div>
        <p>or drop a Markdown file here</p>
      </section>
      <article id="doc" class="markdown" hidden></article>
    </div>
  </main>
</div>
</body>
</html>
